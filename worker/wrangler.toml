name = "tradepilot-pro-api"
main = "src/index.mjs"
compatibility_date = "2026-10-09"
workers_dev = true

# Set ALLOWED_ORIGIN to the exact production app origin.
# Configure secrets using wrangler secret put:
# TWELVE_DATA_API_KEY (optional direct-provider fallback)
# CLIENT_ACCESS_TOKEN (legacy /api/candles only; never expose in browser)
# Do not put secret values in this file.

# Native scheduled invocation; global switch below keeps production inactive.
[triggers]
crons = ["*/5 * * * *"]

[vars]
BACKGROUND_ALERTS_ENABLED = "false"
ALLOWED_ORIGIN = "https://tradepilot-pro-api.alexvdslot.workers.dev"
ACCESS_TEAM_DOMAIN = "misty-surf-09c1.cloudflareaccess.com"
ACCESS_AUD = "24efd2464d42ed45488e980ad0c72f8c3c726d30c97d70079d822d8cd449cdf3"

# EU-jurisdiction staging database provisioned on 2026-10-10.
# Access configured and audited 2026-10-10. Audience/domain are public identifiers.
# Preserve secret bindings when deploying; use the same origin for app and API.
[[d1_databases]]
binding = "DB"
database_name = "tradepilot-pro-staging"
database_id = "052feeda-74df-4a2e-923f-0a2bf1d97d08"

# Reuse the existing provider secret internally; no key is copied into this Worker.
[[services]]
binding = "MARKET_PROVIDER"
service = "tradepilot-market-data"

# Atomic shared Twelve Data quota. Provider Worker uses the same database/binding.
[[d1_databases]]
binding = "MARKET_QUOTA_DB"
database_name = "tradepilot-pro-staging"
database_id = "052feeda-74df-4a2e-923f-0a2bf1d97d08"

# Named private RPC entrypoint; never forwards an owner JWT.
[[services]]
binding = "BACKGROUND_MARKET"
service = "tradepilot-market-data"
entrypoint = "BackgroundMarket"
