name: TradePilot checks
on:
  push:
    paths:
      - 'v4.html'
      - 'v5.html'
      - 'playwright.config.cjs'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  pull_request:
  workflow_dispatch:
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portfolio regression tests
        run: node --test tests/*.test.cjs
      - name: Check frontend JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const path of ['v4.html','v5.html']){
            const html=fs.readFileSync(path,'utf8');
            const js=html.split('<script>')[1]?.split('</script>')[0];
            if(!js)throw Error('Missing script: '+path);
            new vm.Script(js,{filename:path});
            console.log(path+' JavaScript syntax valid');
          }
          NODE
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.58.2
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Chromium end-to-end tests
        run: npx playwright test
