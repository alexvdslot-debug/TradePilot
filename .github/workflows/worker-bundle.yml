name: TradePilot Worker bundle validation

on:
  push:
    branches: [tradepilot-pro-rebuild]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pro/**'
      - 'worker/**'
      - 'scripts/build-assets.mjs'
      - 'package*.json'
      - '.github/workflows/worker-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate Worker-embedded frontend from current source
        run: npm run build
      - name: Confirm generated frontend and syntax
        run: npm run check
      - name: Run application and mobile navigation regression tests
        run: npm test
      - name: Install Wrangler for offline bundling
        run: npm install --no-save wrangler@4
      - name: Bundle all imported Worker modules without deploying
        working-directory: worker
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir ../.wrangler-dry-run

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium and WebKit browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run real browser UX checks
        run: npm run test:browser
      - name: Upload mobile screenshots and browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradepilot-browser-test-results
          path: test-results/
          if-no-files-found: ignore
