name: TradePilot Pro quality gates
on:
  push:
    branches: [tradepilot-pro-rebuild]
  pull_request:
    paths: ['pro/**', 'worker/**', '.github/workflows/tradepilot-pro.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify indicator and Worker tests
        run: node --test pro/indicators.test.mjs worker/index.test.mjs worker/b3-settings.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check pro/indicators.mjs
          node --check worker/src/index.mjs
          node --check worker/src/b3-settings.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('pro/index.html','utf8');
          const js=html.split('<script>')[1]?.split('</script>')[0];
          if(!js)throw Error('Missing pro script');
          new vm.Script(js,{filename:'pro/index.html'});
          for(const id of ['settings','settingsForm','settingsShortcut','saveSettings','accountStatus','loginLink','logoutLink'])if(!html.includes('id="'+id+'"'))throw Error('Missing B3 UI: '+id);
          const login=html.match(/id="loginLink" href="([^"]+)"/)?.[1];
          const logout=html.match(/id="logoutLink" href="([^"]+)"/)?.[1];
          if(login!=='https://tradepilot-pro-api.alexvdslot.workers.dev/api/v1/session')throw Error('Login must point to Access-protected API origin');
          if(logout!=='https://tradepilot-pro-api.alexvdslot.workers.dev/cdn-cgi/access/logout')throw Error('Logout must use Access-protected origin');
          NODE
