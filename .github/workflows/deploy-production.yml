name: TradePilot Pro controlled deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradepilot-pro-production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify application
        run: |
          npm ci
          npm test
          npm run check
      - name: Install Cloudflare Wrangler
        run: npm install --no-save wrangler@4
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy complete Worker module graph
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml --keep-vars
      - name: Verify authenticated app boundary
        run: |
          node --input-type=module <<'NODE'
          const url='https://tradepilot-pro-api.alexvdslot.workers.dev/app/';
          const r=await fetch(url,{redirect:'manual'});
          if(![200,302,303,307,308].includes(r.status))throw Error('Unexpected app response: '+r.status);
          const text=await r.text();
          if(r.status===200 && !text.includes('TradePilot'))throw Error('App shell missing');
          console.log('App boundary HTTP',r.status);
          NODE
